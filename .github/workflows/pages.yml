name: Verify and deploy project documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_GEMFILE: ${{ github.workspace }}/website/Gemfile

jobs:
  verify_and_build:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
          working-directory: website
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npx playwright install --with-deps chromium
        working-directory: website
      - name: Test the runtime, installed gem, and frontend
        env:
          RUN_BROWSER_TESTS: '1'
        run: website/bin/test
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: website/test-results
          if-no-files-found: ignore
          retention-days: 3
      - name: Verify both themes at a root URL
        run: |
          for theme in minimal docs; do
            website/bin/build --example --theme "$theme" --url https://example.invalid --baseurl '' --destination "site-$theme-root" --skip-assets
          done
      - name: Read Pages metadata
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Build the project documentation with the candidate gem
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin || 'https://example.invalid' }}
          SITE_BASEURL: ${{ github.event_name == 'pull_request' && '/preview' || steps.pages.outputs.base_path }}
        run: bundle exec jekyll-obsidian build --url "$SITE_ORIGIN" --baseurl "$SITE_BASEURL"
      - name: Upload the verified site
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: .jekyll-obsidian-cache/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: verify_and_build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
