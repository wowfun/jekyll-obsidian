name: Publish Ruby gem

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.2.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rubygems-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/website/Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
          working-directory: website
      - name: Check the release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ruby -r ./website/lib/jekyll_obsidian/version -e 'abort "Tag must match the gem version" unless ENV.fetch("RELEASE_TAG") == "v#{JekyllObsidian::VERSION}"'
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npx playwright install --with-deps chromium
        working-directory: website
      - name: Build and test the release artifact
        env:
          RUN_BROWSER_TESTS: '1'
        run: website/bin/test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-gem
          path: pkg/*.gem
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '4.0.6'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-gem
          path: pkg
      - name: Authenticate with RubyGems Trusted Publishing
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a
      - name: Publish the tested gem
        run: gem push pkg/*.gem

  verify_installation:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [standalone, bundled]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          path: .builder-action
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '4.0.6'
      - name: Create an independent host
        env:
          HOST_MODE: ${{ matrix.host }}
        run: |
          mkdir -p .github docs
          printf 'title: Package smoke test\nwebsite:\n  source: docs\n  theme: docs\n' > .github/jekyll-obsidian.yml
          printf '%s\n' '---' 'publish: true' '---' '# Published package works' > docs/index.md
          if [ "$HOST_MODE" = bundled ]; then
            version=$(ruby -r ./.builder-action/website/lib/jekyll_obsidian/version -e 'print JekyllObsidian::VERSION')
            printf 'source "https://rubygems.org"\ngem "jekyll-obsidian-site", "=%s"\n' "$version" > Gemfile
            bundle lock
            sha256sum Gemfile Gemfile.lock > bundle-before.sha256
          fi
      - name: Build with the released Action and public gem
        id: build
        uses: ./.builder-action
        with:
          url: https://example.invalid
          baseurl: /package-smoke
      - name: Verify the host output
        env:
          SITE_PATH: ${{ steps.build.outputs.site-path }}
          HOST_MODE: ${{ matrix.host }}
        run: |
          test ! -d website
          test -f "$SITE_PATH/index.html"
          grep -q 'Published package works' "$SITE_PATH/index.html"
          if [ "$HOST_MODE" = bundled ]; then
            sha256sum -c bundle-before.sha256
            bundle exec jekyll-obsidian --version
          else
            jekyll-obsidian --version
          fi
