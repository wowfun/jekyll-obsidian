name: Publish Ruby gem

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rubygems-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/website/Gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
          working-directory: website
      - name: Check the release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ruby -r ./website/lib/jekyll_obsidian/version -e 'abort "Tag must match the gem version" unless ENV.fetch("RELEASE_TAG") == "v#{JekyllObsidian::VERSION}"'
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npx playwright install --with-deps chromium
        working-directory: website
      - name: Build and test the release artifact
        env:
          RUN_BROWSER_TESTS: '1'
        run: website/bin/test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-gem
          path: pkg/*.gem
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '4.0.6'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-gem
          path: pkg
      - name: Authenticate with RubyGems Trusted Publishing
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a
      - name: Publish the tested gem
        run: gem push pkg/*.gem
