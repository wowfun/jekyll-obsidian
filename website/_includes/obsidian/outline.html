<section class="relation-section" aria-labelledby="outline-title-{{ include.location }}">
  <h2 class="relation-section__title" id="outline-title-{{ include.location }}">On this page</h2>
  {% if page.obsidian.outline and page.obsidian.outline.size > 0 %}
    <ol class="outline-list">
      {% for item in page.obsidian.outline %}
        <li class="outline-level-{{ item.level }}"><a href="#{{ item.id | escape }}" data-outline-link>{{ item.label | escape }}</a></li>
      {% endfor %}
    </ol>
  {% else %}
    <p class="relation-empty">No headings on this page.</p>
  {% endif %}
</section>
