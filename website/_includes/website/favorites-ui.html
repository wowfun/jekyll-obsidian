{% if page.website.features.favorites %}
  <div data-favorites-ui data-save="{{ ui.favorite_save | default: 'Save' | escape }}" data-remove="{{ ui.favorite_remove | default: 'Remove favorite' | escape }}" data-saved="{{ ui.favorite_saved | default: 'Saved' | escape }}" data-empty="{{ ui.favorites_empty | default: 'No favorites yet. Save an entry to find it here.' | escape }}" data-error="{{ ui.favorite_storage_error | escape }}" data-damaged="{{ ui.favorite_storage_damaged | escape }}" data-unreadable="{{ ui.favorite_storage_unreadable | escape }}" data-unsupported="{{ ui.favorite_storage_unsupported | escape }}" data-quota="{{ ui.favorite_storage_quota | escape }}" data-blocked="{{ ui.favorite_storage_blocked | escape }}" data-removed="{{ ui.favorite_removed_article | escape }}" data-refresh-error="{{ ui.favorites_refresh_error | escape }}" data-undated="{{ ui.undated | default: 'Undated' | escape }}" data-recovery-restored="{{ ui.favorite_recovery_restored | escape }}" data-recovery-cleared="{{ ui.favorite_recovery_cleared | escape }}" data-recovery-required="{{ ui.favorite_recovery_required | escape }}"></div>
  <p class="favorite-status" role="status" aria-live="polite" data-favorite-status></p>
  <details class="favorites-recovery" data-favorites-recovery hidden>
    <summary>{{ ui.favorite_recovery_title | default: 'Recovery copies' | escape }}</summary>
    <p>{{ ui.favorite_recovery_description | escape }}</p>
    <div class="favorites-recovery__actions">
      <button type="button" data-favorite-recovery="download">{{ ui.favorite_recovery_download | default: 'Download original data' | escape }}</button>
      <button type="button" data-favorite-recovery="restore">{{ ui.favorite_recovery_restore | default: 'Restore available favorites' | escape }}</button>
      <button type="button" data-favorite-recovery="clear">{{ ui.favorite_recovery_clear | default: 'Clear recovery copies' | escape }}</button>
    </div>
  </details>
{% endif %}
