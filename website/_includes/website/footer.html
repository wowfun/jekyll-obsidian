<footer class="site-footer">
  {% assign ui = page.website.i18n.messages %}
  <div class="site-footer__inner">
    <span>{{ ui.built_by | default: 'Built by' | escape }}</span>
    <a class="site-footer__github" href="https://github.com/wowfun/jekyll-obsidian" aria-label="{{ ui.project_on_github | default: 'Jekyll Obsidian on GitHub' | escape }}">
      {% include website/github-icon.html %}
      <span>Jekyll Obsidian</span>
    </a>
    <span aria-hidden="true">·</span>
    <span>MIT License</span>
    <span aria-hidden="true">·</span>
    <time datetime="{{ site.time | date: "%Y" }}">{{ site.time | date: "%Y" }}</time>
  </div>
</footer>
