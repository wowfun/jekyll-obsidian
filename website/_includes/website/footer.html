<footer class="site-footer">
  {% assign ui = page.website.i18n.messages %}
  <div class="site-footer__inner">
    <span>{{ ui.built_by | default: 'Built by' | escape }}</span>
    {% if site.data.website_repository_url %}
      <a class="site-footer__github" href="{{ site.data.website_repository_url | escape }}" aria-label="{{ ui.project_on_github | default: 'Jekyll Obsidian on GitHub' | escape }}">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M8 0C3.58 0 0 3.64 0 8.13c0 3.59 2.29 6.64 5.47 7.72.4.08.55-.18.55-.39 0-.19-.01-.83-.01-1.51-2.01.38-2.53-.5-2.69-.96-.09-.23-.48-.96-.82-1.15-.28-.15-.68-.53-.01-.54.63-.01 1.08.59 1.23.83.72 1.23 1.87.88 2.33.67.07-.53.28-.88.51-1.08-1.78-.21-3.64-.9-3.64-4.01 0-.88.31-1.61.82-2.18-.08-.2-.36-1.04.08-2.15 0 0 .67-.22 2.2.83A7.4 7.4 0 0 1 8 3.94c.68 0 1.36.09 2 .27 1.53-1.05 2.2-.83 2.2-.83.44 1.11.16 1.95.08 2.15.51.57.82 1.3.82 2.18 0 3.12-1.87 3.8-3.65 4.01.29.25.54.74.54 1.5 0 1.08-.01 1.95-.01 2.22 0 .21.15.47.55.39A8.16 8.16 0 0 0 16 8.13C16 3.64 12.42 0 8 0Z"/>
        </svg>
        <span>Jekyll Obsidian</span>
      </a>
    {% else %}
      <span>Jekyll Obsidian</span>
    {% endif %}
    <span aria-hidden="true">·</span>
    <span>MIT License</span>
    <span aria-hidden="true">·</span>
    <time datetime="{{ site.time | date: "%Y" }}">{{ site.time | date: "%Y" }}</time>
  </div>
</footer>
