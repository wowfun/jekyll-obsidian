# Generated by website/bin/integrate. Re-run that command instead of editing this file.
name: Verify and deploy Pages

on:
  push:
    paths:
      - '__JEKYLL_WEBSITE_SOURCE_GLOB__'
      - 'website/**'
      - '.github/jekyll-obsidian.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - '__JEKYLL_WEBSITE_SOURCE_GLOB__'
      - 'website/**'
      - '.github/jekyll-obsidian.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ (github.event_name == 'pull_request' && format('verify-{0}', github.event.pull_request.number)) ||
        (github.event_name == 'push' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) && format('ignored-{0}', github.run_id)) ||
        'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUBY_VERSION: 4.0.6
  NODE_VERSION: 26.3.1
  BUNDLE_GEMFILE: ${{ github.workspace }}/website/Gemfile

defaults:
  run:
    working-directory: website

jobs:
  verify:
    if: >-
      github.event_name != 'push' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Restore executable scripts
        run: chmod +x bin/build bin/dev bin/integrate bin/setup bin/test bin/update scripts/*.sh test/integration/*.sh

      - name: Check host integration
        run: bin/integrate --check

      - name: Classify the complete change range
        id: scope
        env:
          BASE_SHA: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || (github.event_name == 'push' && github.event.before) || '' }}
          HEAD_SHA: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}
        run: scripts/ci-scope.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: website

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Install the Chromium test browser
        if: steps.scope.outputs.full == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run template regression tests
        if: steps.scope.outputs.full == 'true'
        env:
          RUN_BROWSER_TESTS: "1"
        run: bin/test

      - name: Upload browser failure artifacts
        if: failure() && steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: website/test-results
          if-no-files-found: ignore
          retention-days: 3

      - name: Build the bundled example in every deployment shape
        if: steps.scope.outputs.full == 'true'
        env:
          JEKYLL_ENV: production
        run: |
          for theme in minimal docs; do
            bin/build \
              --example \
              --theme "$theme" \
              --url https://example.invalid \
              --baseurl "" \
              --destination "_site-$theme-root" \
              --skip-assets
          done
          bin/build \
            --example \
            --theme minimal \
            --url https://example.invalid \
            --baseurl /jekyll-obsidian \
            --destination _site-minimal-project \
            --skip-assets

      - name: Validate the host content
        env:
          JEKYLL_ENV: production
          JEKYLL_OBSIDIAN_GITHUB_MARKDOWN_MANIFEST_OUT: .jekyll-obsidian-cache/github-markdown-run.json
        run: >-
          bin/build
          --url https://example.invalid
          --baseurl /host-preview
          --destination _site-host-content

      - name: Freeze GitHub Markdown inputs for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: github-markdown-${{ github.run_id }}
          path: website/.jekyll-obsidian-cache/github-markdown-run.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  build_pages:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Restore executable scripts
        run: chmod +x bin/build bin/dev bin/integrate bin/setup bin/test bin/update scripts/*.sh test/integration/*.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: website

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Restore verified GitHub Markdown inputs
        # Remove after actions/download-artifact#484 is fixed in a release.
        env:
          NODE_OPTIONS: --disable-warning=DEP0005
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: github-markdown-${{ github.run_id }}
          path: website/.jekyll-obsidian-cache

      - name: Read Pages metadata
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build the production site
        env:
          JEKYLL_ENV: production
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          JEKYLL_OBSIDIAN_GITHUB_MARKDOWN_MANIFEST_IN: .jekyll-obsidian-cache/github-markdown-run.json
        run: >-
          bin/build
          --url "$PAGES_ORIGIN"
          --baseurl "$PAGES_BASE_PATH"
          --destination _site

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: website/_site

  deploy:
    needs: build_pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # Remove after actions/deploy-pages#434 is fixed in a release.
        env:
          NODE_OPTIONS: --disable-warning=DEP0040
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
